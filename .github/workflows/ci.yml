name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host-side deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          set -e
          for f in scripts/*.py tools/*.py; do
            echo "  $f"
            python -c "import ast; ast.parse(open('$f').read())"
          done

      - name: Check shell syntax
        run: |
          set -e
          for f in slurm/*.sh containers/*.sh; do
            echo "  $f"
            bash -n "$f"
          done

      - name: Import tools package
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import tools; print('tools OK')"
